<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>コード再生ツール</title>
<style>
  :root {
    --bg: #14161f;
    --panel: #1e2130;
    --panel-2: #262a3d;
    --accent: #7c9dff;
    --accent-2: #ff9ecf;
    --good: #5fd68a;
    --text: #e9ebf5;
    --text-dim: #9aa0b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 20% -10%, #2a2f4a, var(--bg) 60%);
    color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    display: flex;
    justify-content: center;
    padding: 32px 16px 64px;
  }
  .app {
    width: 100%;
    max-width: 640px;
  }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 4px;
    letter-spacing: 0.02em;
  }
  .sub {
    color: var(--text-dim);
    font-size: 0.9rem;
    margin-bottom: 8px;
  }
  .nav {
    margin-bottom: 24px;
  }
  .nav a {
    color: var(--accent);
    font-size: 0.85rem;
    text-decoration: none;
  }
  .nav a:hover { text-decoration: underline; }
  .panel {
    background: var(--panel);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  }
  .row-label {
    display: block;
    color: var(--text-dim);
    font-size: 0.8rem;
    margin-bottom: 8px;
  }
  .root-row {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }
  .root-btn {
    padding: 12px 4px;
    border-radius: 10px;
    border: 1px solid #3a3f5c;
    background: var(--panel-2);
    color: var(--text);
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: 600;
  }
  .root-btn.active {
    background: var(--accent);
    color: #10121c;
    border-color: var(--accent);
  }
  .control-row {
    display: flex;
    gap: 16px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }
  .octave-group {
    display: flex;
    gap: 6px;
  }
  .octave-btn {
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid #3a3f5c;
    background: var(--panel-2);
    color: var(--text-dim);
    cursor: pointer;
    font-size: 0.8rem;
  }
  .octave-btn.active {
    background: var(--accent-2);
    color: #1a0d14;
    border-color: var(--accent-2);
    font-weight: 600;
  }
  .toggle-label {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-dim);
    font-size: 0.85rem;
    cursor: pointer;
  }
  .now-playing {
    text-align: center;
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--accent-2);
    min-height: 34px;
    margin: 12px 0 4px;
  }
  .now-playing small {
    display: block;
    font-size: 0.75rem;
    color: var(--text-dim);
    font-weight: 400;
    margin-top: 2px;
  }
  .group-title {
    color: var(--text-dim);
    font-size: 0.8rem;
    margin: 18px 0 8px;
  }
  .group-title:first-of-type { margin-top: 4px; }
  .chord-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
  }
  .chord-btn {
    padding: 14px 8px;
    border-radius: 10px;
    border: 1px solid #3a3f5c;
    background: var(--panel-2);
    color: var(--text);
    cursor: pointer;
    font-size: 0.9rem;
    transition: all 0.1s;
  }
  .chord-btn:hover { border-color: var(--accent); }
  .chord-btn.playing {
    background: var(--good);
    color: #0d1a10;
    border-color: var(--good);
    transform: scale(0.96);
  }
</style>
</head>
<body>
<div class="app">
  <h1>🎹 コード再生ツール</h1>
  <div class="sub">ルートとコードの種類を選ぶと、その場で鳴らせます</div>
  <div class="nav"><a href="index.html">← コード当てゲームへ</a></div>

  <div class="panel">
    <label class="row-label">ルート音</label>
    <div class="root-row" id="rootRow"></div>

    <div class="control-row">
      <div class="octave-group" id="octaveGroup">
        <button class="octave-btn" data-oct="48">低め</button>
        <button class="octave-btn active" data-oct="60">標準</button>
        <button class="octave-btn" data-oct="72">高め</button>
      </div>
      <label class="toggle-label">
        <input type="checkbox" id="arpToggle">
        分散(アルペジオ)で再生
      </label>
    </div>

    <div class="now-playing" id="nowPlaying"></div>

    <div id="chordGroups"></div>
  </div>
</div>

<script src="chords.js"></script>
<script src="audio.js"></script>
<script>
const GROUP_LABELS = {
  triad: "三和音",
  sixthSus: "6th・サスコード",
  seventh: "7th系",
  tension: "テンション系(9th等)",
};

let octaveBase = 60;
let rootPitchClass = 0;

const rootRow = document.getElementById("rootRow");
const octaveGroup = document.getElementById("octaveGroup");
const arpToggle = document.getElementById("arpToggle");
const nowPlaying = document.getElementById("nowPlaying");
const chordGroups = document.getElementById("chordGroups");

NOTE_NAMES.forEach((name, i) => {
  const btn = document.createElement("button");
  btn.className = "root-btn" + (i === 0 ? " active" : "");
  btn.textContent = name;
  btn.addEventListener("click", () => {
    rootPitchClass = i;
    document.querySelectorAll(".root-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
  });
  rootRow.appendChild(btn);
});

octaveGroup.querySelectorAll(".octave-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    octaveBase = Number(btn.dataset.oct);
    octaveGroup.querySelectorAll(".octave-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
  });
});

Object.keys(GROUP_LABELS).forEach(groupKey => {
  const title = document.createElement("div");
  title.className = "group-title";
  title.textContent = GROUP_LABELS[groupKey];
  chordGroups.appendChild(title);

  const grid = document.createElement("div");
  grid.className = "chord-grid";
  CHORD_LIBRARY[groupKey].forEach(ct => {
    const btn = document.createElement("button");
    btn.className = "chord-btn";
    btn.textContent = `${ct.name} (${ct.symbol || "maj"})`;
    btn.addEventListener("click", () => {
      const rootMidi = octaveBase + rootPitchClass;
      playChord(ct.intervals, rootMidi, arpToggle.checked);
      nowPlaying.innerHTML = `${fullChordSymbol(ct, rootMidi)}<small>${rootName(rootMidi)} ${ct.name}</small>`;
      document.querySelectorAll(".chord-btn").forEach(b => b.classList.remove("playing"));
      btn.classList.add("playing");
      setTimeout(() => btn.classList.remove("playing"), 300);
    });
    grid.appendChild(btn);
  });
  chordGroups.appendChild(grid);
});
</script>
</body>
</html>
