<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>卒アル見開きコラージュ</title>
<style>
:root{
  --bg:#f3f1ec; --panel:#ffffff; --ink:#26231f; --sub:#6f6a62; --line:#e2ddd4;
  --accent:#d0603a; --accent-ink:#fff; --ok:#3f8a5a; --warn:#c2731d;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;font-size:14px}
header{display:flex;align-items:center;gap:16px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:16px;margin:0;white-space:nowrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#faf8f4;border-radius:999px;padding:6px 12px;cursor:pointer;font:inherit;display:flex;gap:6px;align-items:center}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab .cnt{font-size:11px;padding:1px 6px;border-radius:999px;background:rgba(0,0,0,.08)}
.tab.on .cnt{background:rgba(255,255,255,.2)}
.tab .cnt.full{background:var(--ok);color:#fff}
.app{display:flex;height:calc(100% - 53px)}
aside{width:320px;flex:none;overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:8px 14px 40px}
main{flex:1;display:flex;flex-direction:column;min-width:0}
details{border-bottom:1px solid var(--line);padding:6px 0}
summary{font-weight:700;cursor:pointer;padding:6px 0}
.row{display:flex;align-items:center;gap:8px;margin:6px 0}
.row label{flex:1;color:var(--sub);font-size:13px}
.row input[type=number]{width:72px}
.row input[type=text]{flex:1.4;min-width:0}
input,select{font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
input[type=color]{padding:0;width:40px;height:28px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;color:var(--ink)}
button:hover{border-color:#bdb5a8}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.block{display:block;width:100%;margin:6px 0;text-align:left}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btns button{flex:1}
.note{color:var(--sub);font-size:12px;line-height:1.6;margin:4px 0}
.toolbar{display:flex;align-items:center;gap:10px;padding:8px 16px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;border-radius:0;padding:6px 12px}
.seg button.on{background:var(--ink);color:#fff}
.status{margin-left:auto;color:var(--sub);font-size:13px}
.status b.ok{color:var(--ok)} .status b.warn{color:var(--warn)}
#stage{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:12px 16px 20px}
.spread{position:relative;box-shadow:0 6px 30px rgba(0,0,0,.15);user-select:none;-webkit-user-select:none}
.guide{position:absolute;pointer-events:none;border:1px dashed rgba(208,96,58,.7)}
.gutter{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed rgba(0,0,0,.35);pointer-events:none}
.margin{position:absolute;pointer-events:none;border:1px dotted rgba(60,120,200,.55)}
.cell{position:absolute;overflow:hidden;cursor:grab;background:#ddd}
.cell img{position:absolute;max-width:none;pointer-events:none;-webkit-user-drag:none}
.cell.src{outline:3px solid var(--accent);opacity:.6}
.cell.tgt{outline:3px solid #3a7bd0;outline-offset:-3px}
.mode-crop .cell{cursor:move}
.cell .x{position:absolute;right:3px;top:3px;width:20px;height:20px;border-radius:50%;border:0;padding:0;background:rgba(0,0,0,.6);color:#fff;font-size:12px;line-height:20px;display:none;cursor:pointer}
.cell:hover .x{display:block}
.ttl{position:absolute;white-space:nowrap;overflow:hidden;line-height:1;display:flex;align-items:center;pointer-events:none}
.empty{border:2px dashed #c9c1b4;border-radius:16px;padding:40px;text-align:center;color:var(--sub);background:rgba(255,255,255,.6);max-width:520px}
.empty b{display:block;font-size:18px;color:var(--ink);margin-bottom:8px}
#stage.drag .spread,#stage.drag .empty{outline:4px dashed var(--accent);outline-offset:6px}
#overlay{position:fixed;inset:0;background:rgba(20,18,15,.55);display:none;align-items:center;justify-content:center;z-index:10}
#overlay .box{background:#fff;border-radius:12px;padding:20px 24px;min-width:300px}
#overlay .bar{height:8px;background:#eee;border-radius:4px;overflow:hidden;margin-top:12px}
#overlay .bar i{display:block;height:100%;background:var(--accent);width:0}
.hint{padding:0 16px 10px;color:var(--sub);font-size:12px}
@media (max-width:820px){
  .app{flex-direction:column;height:auto}
  aside{width:auto;border-right:0;border-bottom:1px solid var(--line);max-height:none}
  #stage{min-height:60vh}
}
</style>
</head>
<body>
<header>
  <h1>📚 卒アル見開きコラージュ</h1>
  <div class="tabs" id="tabs"></div>
</header>
<div class="app">
<aside>
  <details open>
    <summary>① 写真</summary>
    <div class="btns">
      <button class="primary" id="btnAdd">写真を追加</button>
      <button id="btnAddDir">フォルダごと追加</button>
    </div>
    <p class="note">この学年に追加されます。画面にドラッグ＆ドロップでもOK。写真はPCの外に送られず、ブラウザの中だけで処理されます。</p>
    <div class="row"><label>並び順</label>
      <select id="sortMode">
        <option value="date">撮影日順</option>
        <option value="name">ファイル名順</option>
        <option value="shuffle">バランス重視（シャッフル）</option>
        <option value="manual">手動（入れ替えた順）</option>
      </select>
    </div>
    <div class="btns">
      <button id="btnShuffle">🔀 別の配置を試す</button>
      <button id="btnClear">この学年を空にする</button>
    </div>
    <details>
      <summary style="font-weight:400">全学年まとめて振り分け（撮影日）</summary>
      <div class="row"><label>入学した年（4月）</label><input type="number" id="entryYear" min="2000" max="2100"></div>
      <button class="block" id="btnDistribute">写真をまとめて選んで学年に自動振り分け</button>
      <p class="note">撮影日（EXIF）で 4月〜翌3月 を1学年として振り分けます。撮影日が読めない写真はファイルの更新日時を使います。</p>
    </details>
  </details>

  <details open>
    <summary>② ページサイズ</summary>
    <div class="row"><label>判型（1ページ）</label>
      <select id="preset">
        <option value="A4P">A4 縦（210×297）</option>
        <option value="A4L">A4 横（297×210）</option>
        <option value="AB">AB判（210×257）</option>
        <option value="B5P">B5 縦（182×257）</option>
        <option value="SQ">正方形（210×210）</option>
        <option value="custom">カスタム</option>
      </select>
    </div>
    <div class="row"><label>幅 / 高さ (mm)</label><input type="number" data-k="pageW" step="1"><input type="number" data-k="pageH" step="1"></div>
    <div class="row"><label>塗り足し (mm)</label><input type="number" data-k="bleed" step="0.5" min="0"></div>
    <div class="row"><label>書き出し解像度 (dpi)</label><input type="number" data-k="dpi" step="10" min="72" max="600"></div>
    <div class="row"><label>目標枚数（1見開き）</label><input type="number" data-k="target" step="1" min="1"></div>
  </details>

  <details open>
    <summary>③ 余白・間隔</summary>
    <div class="row"><label>外側の余白 (mm)</label><input type="number" data-k="mOuter" step="0.5" min="0"></div>
    <div class="row"><label>ノド（綴じ側）の余白 (mm)</label><input type="number" data-k="mInner" step="0.5" min="0"></div>
    <div class="row"><label>上 / 下 (mm)</label><input type="number" data-k="mTop" step="0.5" min="0"><input type="number" data-k="mBottom" step="0.5" min="0"></div>
    <div class="row"><label>写真の間隔 (mm)</label><input type="number" data-k="gap" step="0.25" min="0"></div>
    <p class="note">ノドは綴じ目に写真が飲み込まれないよう、外側より広めがおすすめ。</p>
  </details>

  <details>
    <summary>④ 見た目</summary>
    <div class="row"><label>背景色</label><input type="color" data-k="bg"></div>
    <div class="row"><label>角の丸み (mm)</label><input type="number" data-k="radius" step="0.5" min="0"></div>
    <div class="row"><label>フチの太さ (mm)</label><input type="number" data-k="stroke" step="0.25" min="0"></div>
    <div class="row"><label>フチの色</label><input type="color" data-k="strokeColor"></div>
  </details>

  <details open>
    <summary>⑤ タイトル</summary>
    <div class="row"><label>この学年のタイトル</label><input type="text" id="gradeTitle"></div>
    <div class="row"><label>置く場所</label>
      <select data-k="titlePos"><option value="left">左ページの上</option><option value="right">右ページの上</option><option value="none">なし</option></select>
    </div>
    <div class="row"><label>揃え</label>
      <select data-k="titleAlign"><option value="left">左</option><option value="center">中央</option><option value="right">右</option></select>
    </div>
    <div class="row"><label>文字の大きさ (pt)</label><input type="number" data-k="titlePt" step="1" min="6"></div>
    <div class="row"><label>文字の色</label><input type="color" data-k="titleColor"></div>
    <div class="row"><label>書体</label>
      <select data-k="titleFont">
        <option value="gothic">ゴシック</option>
        <option value="maru">丸ゴシック</option>
        <option value="mincho">明朝</option>
      </select>
    </div>
  </details>

  <details open>
    <summary>⑥ 書き出し（JPEG）</summary>
    <button class="block primary" id="expSpread">この学年を書き出す（見開き1枚）</button>
    <button class="block" id="expPages">この学年を書き出す（左右ページ別）</button>
    <button class="block" id="expAll">全学年まとめて書き出す</button>
    <p class="note">塗り足し込みのサイズ・指定dpiで出力します。複数ファイルのダウンロード許可を聞かれたら「許可」してください。</p>
  </details>
</aside>

<main>
  <div class="toolbar">
    <div class="seg" id="modeSeg">
      <button data-mode="swap" class="on">↔ 入れ替え</button>
      <button data-mode="crop">✥ 位置調整</button>
    </div>
    <label style="display:flex;gap:6px;align-items:center;color:var(--sub)"><input type="checkbox" id="showGuides" checked>ガイド線</label>
    <div class="status" id="status"></div>
  </div>
  <div id="stage"></div>
  <div class="hint" id="hint"></div>
</main>
</div>

<input type="file" id="fileIn" accept="image/*" multiple hidden>
<input type="file" id="dirIn" webkitdirectory multiple hidden>
<input type="file" id="distIn" accept="image/*" multiple hidden>
<div id="overlay"><div class="box"><div id="ovText">処理中…</div><div class="bar"><i id="ovBar"></i></div></div></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

/* ---------- 状態 ---------- */
const PRESETS = { A4P:[210,297], A4L:[297,210], AB:[210,257], B5P:[182,257], SQ:[210,210] };
const DEFAULTS = {
  preset:'A4P', pageW:210, pageH:297, bleed:3, dpi:350, target:50,
  mOuter:12, mInner:18, mTop:12, mBottom:12, gap:1.5,
  bg:'#ffffff', radius:0, stroke:0, strokeColor:'#ffffff',
  titlePos:'left', titleAlign:'left', titlePt:28, titleColor:'#333333', titleFont:'maru',
  entryYear: new Date().getFullYear() - 6,
  titles: ['1年生','2年生','3年生','4年生','5年生','6年生'],
};
const FONTS = {
  gothic:'"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif',
  maru:'"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","Rounded Mplus 1c","BIZ UDGothic","Yu Gothic",sans-serif',
  mincho:'"Hiragino Mincho ProN","Yu Mincho","YuMincho","MS Mincho",serif',
};
const PT2MM = 25.4/72;

function loadSettings(){
  try { return Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem('yb-collage-settings')||'{}')); }
  catch { return {...DEFAULTS}; }
}
function saveSettings(){ try { localStorage.setItem('yb-collage-settings', JSON.stringify(S.set)); } catch {} }

const S = {
  set: loadSettings(),
  grades: Array.from({length:6}, () => ({ photos:[], sort:'date' })),
  cur: 0,
  mode: 'swap',
};
let uidN = 0; const uid = () => 'p' + (++uidN);

/* ---------- 写真読み込み ---------- */
function isImage(f){ return f.type.startsWith('image/') || /\.(jpe?g|png|webp|gif|heic|heif|avif)$/i.test(f.name); }

async function readExifDate(file){
  if (!/jpe?g/i.test(file.type) && !/\.jpe?g$/i.test(file.name)) return null;
  try {
    const v = new DataView(await file.slice(0, 262144).arrayBuffer());
    if (v.getUint16(0) !== 0xFFD8) return null;
    let o = 2;
    while (o + 4 < v.byteLength) {
      const m = v.getUint16(o);
      if ((m & 0xFF00) !== 0xFF00) return null;
      const len = v.getUint16(o + 2);
      if (m === 0xFFE1 && v.getUint32(o + 4) === 0x45786966) return parseTiffDate(v, o + 10);
      if (m === 0xFFDA) return null;
      o += 2 + len;
    }
  } catch {}
  return null;
}
function parseTiffDate(v, t){
  const le = v.getUint16(t) === 0x4949;
  const u16 = p => v.getUint16(p, le), u32 = p => v.getUint32(p, le);
  const ifd = off => { const p = t + off, n = u16(p), tags = {};
    for (let i = 0; i < n; i++) { const e = p + 2 + i*12; tags[u16(e)] = { count:u32(e+4), val:e+8 }; } return tags; };
  const str = tag => { if (!tag) return null; const off = tag.count > 4 ? t + u32(tag.val) : tag.val;
    let s = ''; for (let i = 0; i < tag.count - 1; i++) s += String.fromCharCode(v.getUint8(off + i)); return s; };
  const i0 = ifd(u32(t + 4));
  let ds = null;
  if (i0[0x8769]) { const ex = ifd(u32(i0[0x8769].val)); ds = str(ex[0x9003]) || str(ex[0x9004]); }
  ds = ds || str(i0[0x0132]);
  const m = ds && ds.match(/(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/);
  return m ? new Date(+m[1], m[2]-1, +m[3], +m[4], +m[5], +m[6]).getTime() : null;
}

function loadImg(url){
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = url; });
}
async function makePhoto(file){
  const date = (await readExifDate(file)) || file.lastModified || 0;
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImg(url);   // 向き（EXIF Orientation）はブラウザが反映
    const w = img.naturalWidth, h = img.naturalHeight;
    const sc = Math.min(1, 800 / Math.max(w, h));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w*sc)); c.height = Math.max(1, Math.round(h*sc));
    const cx = c.getContext('2d'); cx.imageSmoothingQuality = 'high';
    cx.drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
    return { id:uid(), file, name:file.name, date, w, h, thumb:URL.createObjectURL(blob), fx:.5, fy:.5, z:1 };
  } finally { URL.revokeObjectURL(url); }
}

async function pool(items, n, fn){
  let i = 0;
  await Promise.all(Array.from({length:Math.min(n, items.length)}, async () => {
    while (i < items.length) { const k = i++; await fn(items[k], k); }
  }));
}

async function importFiles(files, assign){
  const list = [...files].filter(isImage);
  if (!list.length) return;
  const fails = [], made = [];
  let done = 0;
  overlay(true, `写真を読み込み中… 0 / ${list.length}`, 0);
  await pool(list, 4, async f => {
    try { made.push(await makePhoto(f)); } catch { fails.push(f.name); }
    done++; overlay(true, `写真を読み込み中… ${done} / ${list.length}`, done/list.length);
  });
  let skipped = 0;
  const touched = new Set();
  for (const p of made) {
    const gi = assign(p);
    if (gi == null) { skipped++; URL.revokeObjectURL(p.thumb); continue; }
    const g = S.grades[gi];
    if (g.photos.some(q => q.name === p.name && q.file.size === p.file.size)) { URL.revokeObjectURL(p.thumb); continue; }
    g.photos.push(p); touched.add(gi);
  }
  for (const gi of touched) applySort(S.grades[gi]);
  overlay(false);
  render();
  const msg = [];
  if (fails.length) msg.push(`${fails.length}枚は読み込めませんでした（HEICはChromeでは開けないのでJPEGに変換してください）:\n` + fails.slice(0,10).join('\n'));
  if (skipped) msg.push(`${skipped}枚は撮影日が6年間の範囲外だったので追加していません。`);
  if (msg.length) alert(msg.join('\n\n'));
}

/* ---------- 並び替え ---------- */
function applySort(g){
  if (g.sort === 'date') g.photos.sort((a,b) => a.date - b.date || a.name.localeCompare(b.name, 'ja', {numeric:true}));
  else if (g.sort === 'name') g.photos.sort((a,b) => a.name.localeCompare(b.name, 'ja', {numeric:true}));
  else if (g.sort === 'shuffle') optimizeOrder(g, 400);
}
function optimizeOrder(g, trials){
  const ph = g.photos.slice();
  let best = null, bestScore = Infinity;
  for (let t = 0; t < trials; t++) {
    for (let i = ph.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [ph[i], ph[j]] = [ph[j], ph[i]]; }
    const sc = layoutSpread(ph.map(p => p.w/p.h)).score;
    if (sc < bestScore) { bestScore = sc; best = ph.slice(); }
  }
  if (best) g.photos = best;
}

/* ---------- 自動レイアウト（行揃え・トリミング最小化） ---------- */
// 並び順を保ったまま k 行に分け、各行の縦横比の合計を揃える
function partition(a, k){
  const n = a.length, pre = [0];
  for (const x of a) pre.push(pre[pre.length-1] + x);
  const T = pre[n] / k, INF = 1e18;
  let dp = new Array(n+1).fill(INF); dp[0] = 0;
  const back = [];
  for (let j = 1; j <= k; j++) {
    const nd = new Array(n+1).fill(INF), bk = new Int32Array(n+1);
    for (let i = j; i <= n - (k - j); i++) {
      for (let p = j - 1; p < i; p++) {
        if (dp[p] === INF) continue;
        const c = dp[p] + (pre[i] - pre[p] - T) ** 2;
        if (c < nd[i]) { nd[i] = c; bk[i] = p; }
      }
    }
    back.push(bk); dp = nd;
  }
  const groups = []; let i = n;
  for (let j = k; j >= 1; j--) { const p = back[j-1][i]; groups.unshift([p, i]); i = p; }
  return groups;
}
function justify(ars, W, H, gap){
  const n = ars.length;
  if (!n) return { cells:[], score:0 };
  let best = null;
  for (let k = 1; k <= Math.min(n, 16); k++) {
    const groups = partition(ars, k);
    const hs = groups.map(([a,b]) => { let s = 0; for (let i = a; i < b; i++) s += ars[i]; return (W - (b-a-1)*gap) / s; });
    if (hs.some(h => !(h > 0))) continue;
    const sumH = hs.reduce((a,b) => a+b, 0);
    const s = (H - (k-1)*gap) / sumH;           // 縦方向の伸縮率 = トリミング量
    if (!(s > 0)) continue;
    const mean = sumH / k;
    const cv = Math.sqrt(hs.reduce((a,h) => a + (h-mean)**2, 0) / k) / mean;
    const score = Math.abs(Math.log(s)) + 0.35*cv;
    if (!best || score < best.score) best = { score, groups, hs, s };
  }
  if (!best) return { cells:[], score:99 };
  const cells = []; let y = 0;
  best.groups.forEach(([a,b], gi) => {
    const rh = best.hs[gi] * best.s; let x = 0;
    for (let i = a; i < b; i++) { const w = ars[i]*best.hs[gi]; cells.push({ i, x, y, w, h:rh }); x += w + gap; }
    y += rh + gap;
  });
  return { cells, score:best.score };
}
function pageBoxes(){
  const s = S.set;
  const titleH = s.titlePos === 'none' ? 0 : s.titlePt*PT2MM*1.35;
  const w = s.pageW - s.mOuter - s.mInner, h = s.pageH - s.mTop - s.mBottom;
  const L = { x:s.mOuter, y:s.mTop, w, h }, R = { x:s.pageW + s.mInner, y:s.mTop, w, h };
  let title = null;
  const T = s.titlePos === 'left' ? L : s.titlePos === 'right' ? R : null;
  if (T) { title = { x:T.x, y:T.y, w:T.w, h:titleH }; T.y += titleH + Math.max(s.gap, 2); T.h -= titleH + Math.max(s.gap, 2); }
  return { L, R, title };
}
function layoutSpread(ars){
  const n = ars.length, { L, R } = pageBoxes(), gap = S.set.gap;
  if (!n) return { cells:[], score:0 };
  const mid = Math.round(n * (L.w*L.h) / (L.w*L.h + R.w*R.h));
  let best = null;
  for (let sp = Math.max(0, mid-4); sp <= Math.min(n, mid+4); sp++) {
    if (n >= 2 && (sp === 0 || sp === n)) continue;
    const a = justify(ars.slice(0, sp), L.w, L.h, gap);
    const b = justify(ars.slice(sp), R.w, R.h, gap);
    const score = a.score + b.score + Math.abs(sp - mid)*0.03;
    if (!best || score < best.score) best = { score, a, b, sp };
  }
  const cells = [
    ...best.a.cells.map(c => ({ ...c, x:c.x + L.x, y:c.y + L.y })),
    ...best.b.cells.map(c => ({ ...c, i:c.i + best.sp, x:c.x + R.x, y:c.y + R.y })),
  ];
  return { cells, score:best.score, split:best.sp };
}

/* ---------- 画像の切り抜き計算（プレビューと書き出し共通） ---------- */
function cropBox(p, cw, ch){
  const k = Math.max(cw/p.w, ch/p.h) * p.z;
  const dw = p.w*k, dh = p.h*k;
  return { left:(cw-dw)*p.fx, top:(ch-dh)*p.fy, width:dw, height:dh, k };
}

/* ---------- 画面描画 ---------- */
let view = null;   // { scale, ox, oy, cells }
function render(){
  renderTabs(); renderControls();
  const g = S.grades[S.cur], s = S.set, stage = $('#stage');
  stage.innerHTML = '';
  if (!g.photos.length) {
    stage.innerHTML = `<div class="empty"><b>${esc(S.set.titles[S.cur])} の写真を入れてください</b>ここに写真をドラッグ＆ドロップ、<br>または左の「写真を追加」から選んでください。<br>入れた瞬間に自動でコラージュされます。</div>`;
    view = null; renderStatus(); return;
  }
  const lay = layoutSpread(g.photos.map(p => p.w/p.h));
  const totalW = 2*s.pageW + 2*s.bleed, totalH = s.pageH + 2*s.bleed;
  const sw = stage.clientWidth - 32, sh = stage.clientHeight - 32;
  const scale = Math.max(0.5, Math.min(sw/totalW, sh/totalH));
  const sp = document.createElement('div');
  sp.className = 'spread';
  sp.style.cssText = `width:${totalW*scale}px;height:${totalH*scale}px;background:${s.bg}`;
  const o = s.bleed*scale, X = mm => o + mm*scale, Y = mm => o + mm*scale, D = mm => mm*scale;
  const guides = $('#showGuides').checked;
  if (guides) {
    add(sp, 'guide', { left:X(0), top:Y(0), width:D(2*s.pageW), height:D(s.pageH) });
    const gt = document.createElement('div'); gt.className = 'gutter'; gt.style.left = X(s.pageW) + 'px'; sp.appendChild(gt);
    const { L, R } = pageBoxes();
    for (const b of [L, R]) add(sp, 'margin', { left:X(b.x), top:Y(b.y), width:D(b.w), height:D(b.h) });
  }
  const { title } = pageBoxes();
  if (title) {
    const t = add(sp, 'ttl', { left:X(title.x), top:Y(title.y), width:D(title.w), height:D(title.h) });
    t.textContent = s.titles[S.cur];
    t.style.fontSize = D(s.titlePt*PT2MM) + 'px';
    t.style.color = s.titleColor; t.style.fontFamily = FONTS[s.titleFont]; t.style.fontWeight = '700';
    t.style.justifyContent = { left:'flex-start', center:'center', right:'flex-end' }[s.titleAlign];
  }
  lay.cells.forEach((c, idx) => {
    const p = g.photos[c.i];
    const el = add(sp, 'cell', { left:X(c.x), top:Y(c.y), width:D(c.w), height:D(c.h) });
    el.dataset.idx = c.i;
    if (s.radius) el.style.borderRadius = D(s.radius) + 'px';
    if (s.stroke) el.style.boxShadow = `inset 0 0 0 ${D(s.stroke)}px ${s.strokeColor}`;
    const im = document.createElement('img'); im.src = p.thumb; im.draggable = false;
    placeImg(im, p, D(c.w), D(c.h));
    el.appendChild(im);
    if (s.stroke) { const f = document.createElement('div'); f.style.cssText = `position:absolute;inset:0;box-shadow:inset 0 0 0 ${D(s.stroke)}px ${s.strokeColor};border-radius:inherit;pointer-events:none`; el.appendChild(f); }
    const x = document.createElement('button'); x.className = 'x'; x.textContent = '×'; x.title = 'この写真を外す'; x.dataset.del = c.i;
    el.appendChild(x);
  });
  stage.appendChild(sp);
  view = { scale, cells:lay.cells };
  sp.classList.toggle('mode-crop', S.mode === 'crop');
  renderStatus(lay);
}
function placeImg(im, p, cw, ch){
  const b = cropBox(p, cw, ch);
  im.style.left = b.left + 'px'; im.style.top = b.top + 'px'; im.style.width = b.width + 'px'; im.style.height = b.height + 'px';
}
function add(parent, cls, box){
  const el = document.createElement('div'); el.className = cls;
  for (const k in box) el.style[k] = box[k] + 'px';
  parent.appendChild(el); return el;
}
function esc(t){ return String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function renderTabs(){
  const tabs = $('#tabs'); tabs.innerHTML = '';
  S.grades.forEach((g, i) => {
    const b = document.createElement('button');
    b.className = 'tab' + (i === S.cur ? ' on' : '');
    const full = g.photos.length === S.set.target;
    b.innerHTML = `${i+1}年 <span class="cnt${full ? ' full' : ''}">${g.photos.length}</span>`;
    b.onclick = () => { S.cur = i; render(); };
    tabs.appendChild(b);
  });
}
function renderControls(){
  $$('[data-k]').forEach(el => { if (document.activeElement !== el) el.value = S.set[el.dataset.k]; });
  $('#preset').value = S.set.preset;
  $('#sortMode').value = S.grades[S.cur].sort;
  if (document.activeElement !== $('#gradeTitle')) $('#gradeTitle').value = S.set.titles[S.cur];
  if (document.activeElement !== $('#entryYear')) $('#entryYear').value = S.set.entryYear;
}
function renderStatus(lay){
  const g = S.grades[S.cur], n = g.photos.length, t = S.set.target;
  const cls = n === t ? 'ok' : 'warn';
  let txt = `<b class="${cls}">${n} / ${t} 枚</b>`;
  if (n && n !== t) txt += n < t ? `（あと${t-n}枚）` : `（${n-t}枚多い）`;
  if (lay && lay.cells.length) txt += `　左${lay.split}枚・右${n-lay.split}枚`;
  $('#status').innerHTML = txt;
  $('#hint').textContent = S.mode === 'swap'
    ? '写真をドラッグして別の写真の上で離すと入れ替わります。×で外せます。'
    : '写真をドラッグすると見せる位置がずれます。ホイールで拡大、ダブルクリックで元に戻ります。';
}

/* ---------- 操作（入れ替え・位置調整） ---------- */
let drag = null;
$('#stage').addEventListener('pointerdown', e => {
  if (e.target.dataset.del != null) return;
  const cell = e.target.closest('.cell'); if (!cell || e.button !== 0) return;
  e.preventDefault();
  const idx = +cell.dataset.idx, p = S.grades[S.cur].photos[idx];
  drag = { cell, idx, p, x0:e.clientX, y0:e.clientY, fx:p.fx, fy:p.fy, moved:false, tgt:null };
  cell.setPointerCapture(e.pointerId);
  if (S.mode === 'swap') cell.classList.add('src');
});
$('#stage').addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
  if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
  if (S.mode === 'crop') {
    const cw = drag.cell.clientWidth, ch = drag.cell.clientHeight, b = cropBox(drag.p, cw, ch);
    const clamp = v => Math.min(1, Math.max(0, v));
    if (cw - b.width < 0) drag.p.fx = clamp(drag.fx + dx/(cw - b.width));
    if (ch - b.height < 0) drag.p.fy = clamp(drag.fy + dy/(ch - b.height));
    placeImg(drag.cell.querySelector('img'), drag.p, cw, ch);
  } else {
    const under = document.elementFromPoint(e.clientX, e.clientY);
    const t = under && under.closest('.cell');
    if (drag.tgt && drag.tgt !== t) drag.tgt.classList.remove('tgt');
    drag.tgt = t && t !== drag.cell ? t : null;
    if (drag.tgt) drag.tgt.classList.add('tgt');
  }
});
function endDrag(){
  if (!drag) return;
  const d = drag; drag = null;
  d.cell.classList.remove('src');
  if (S.mode === 'swap' && d.tgt) {
    const g = S.grades[S.cur], j = +d.tgt.dataset.idx;
    [g.photos[d.idx], g.photos[j]] = [g.photos[j], g.photos[d.idx]];
    g.sort = 'manual';
    render();
  }
}
$('#stage').addEventListener('pointerup', endDrag);
$('#stage').addEventListener('pointercancel', endDrag);
$('#stage').addEventListener('click', e => {
  const i = e.target.dataset.del; if (i == null) return;
  const g = S.grades[S.cur], [p] = g.photos.splice(+i, 1);
  URL.revokeObjectURL(p.thumb); render();
});
$('#stage').addEventListener('wheel', e => {
  if (S.mode !== 'crop') return;
  const cell = e.target.closest('.cell'); if (!cell) return;
  e.preventDefault();
  const p = S.grades[S.cur].photos[+cell.dataset.idx];
  p.z = Math.min(4, Math.max(1, p.z * (e.deltaY < 0 ? 1.08 : 1/1.08)));
  placeImg(cell.querySelector('img'), p, cell.clientWidth, cell.clientHeight);
}, { passive:false });
$('#stage').addEventListener('dblclick', e => {
  const cell = e.target.closest('.cell'); if (!cell || S.mode !== 'crop') return;
  const p = S.grades[S.cur].photos[+cell.dataset.idx];
  p.fx = p.fy = .5; p.z = 1; placeImg(cell.querySelector('img'), p, cell.clientWidth, cell.clientHeight);
});
$('#modeSeg').addEventListener('click', e => {
  const m = e.target.dataset.mode; if (!m) return;
  S.mode = m; $$('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.mode === m)); render();
});
$('#showGuides').onchange = render;

/* ドラッグ＆ドロップで追加 */
const stage = $('#stage');
stage.addEventListener('dragover', e => { if (e.dataTransfer.types.includes('Files')) { e.preventDefault(); stage.classList.add('drag'); } });
stage.addEventListener('dragleave', () => stage.classList.remove('drag'));
stage.addEventListener('drop', async e => {
  e.preventDefault(); stage.classList.remove('drag');
  const files = await filesFromDrop(e.dataTransfer);
  importFiles(files, () => S.cur);
});
async function filesFromDrop(dt){
  const items = [...dt.items].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (!items.length) return [...dt.files];
  const out = [];
  const walk = async ent => {
    if (ent.isFile) out.push(await new Promise((r, j) => ent.file(r, j)));
    else if (ent.isDirectory) {
      const rd = ent.createReader();
      let batch;
      do { batch = await new Promise((r, j) => rd.readEntries(r, j)); for (const b of batch) await walk(b); } while (batch.length);
    }
  };
  for (const it of items) await walk(it);
  return out;
}

/* ---------- 設定 ---------- */
$$('[data-k]').forEach(el => el.addEventListener('input', () => {
  const k = el.dataset.k;
  S.set[k] = el.type === 'number' ? (parseFloat(el.value) || 0) : el.value;
  if (k === 'pageW' || k === 'pageH') S.set.preset = 'custom';
  saveSettings(); render();
}));
$('#preset').onchange = e => {
  const v = e.target.value; S.set.preset = v;
  if (PRESETS[v]) [S.set.pageW, S.set.pageH] = PRESETS[v];
  saveSettings(); render();
};
$('#gradeTitle').oninput = e => { S.set.titles[S.cur] = e.target.value; saveSettings(); render(); };
$('#entryYear').oninput = e => { S.set.entryYear = parseInt(e.target.value) || S.set.entryYear; saveSettings(); };
$('#sortMode').onchange = e => { const g = S.grades[S.cur]; g.sort = e.target.value; applySort(g); render(); };
$('#btnShuffle').onclick = () => { const g = S.grades[S.cur]; g.sort = 'shuffle'; optimizeOrder(g, 400); render(); };
$('#btnClear').onclick = () => {
  const g = S.grades[S.cur]; if (!g.photos.length || !confirm(`${S.set.titles[S.cur]} の写真をすべて外しますか？`)) return;
  g.photos.forEach(p => URL.revokeObjectURL(p.thumb)); g.photos = []; render();
};
$('#btnAdd').onclick = () => $('#fileIn').click();
$('#btnAddDir').onclick = () => $('#dirIn').click();
$('#btnDistribute').onclick = () => $('#distIn').click();
$('#fileIn').onchange = e => { importFiles(e.target.files, () => S.cur); e.target.value = ''; };
$('#dirIn').onchange = e => { importFiles(e.target.files, () => S.cur); e.target.value = ''; };
$('#distIn').onchange = e => {
  const ey = S.set.entryYear;
  importFiles(e.target.files, p => {
    const d = new Date(p.date), fy = d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear() - 1;
    const gi = fy - ey; return gi >= 0 && gi < 6 ? gi : null;
  });
  e.target.value = '';
};
new ResizeObserver(() => render()).observe($('#stage'));
window.addEventListener('beforeunload', e => { if (S.grades.some(g => g.photos.length)) { e.preventDefault(); e.returnValue = ''; } });

/* ---------- 書き出し ---------- */
function overlay(on, text, frac){
  $('#overlay').style.display = on ? 'flex' : 'none';
  if (text) $('#ovText').textContent = text;
  if (frac != null) $('#ovBar').style.width = (frac*100) + '%';
}
function roundRectPath(ctx, x, y, w, h, r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath();
}
async function renderSpreadCanvas(gi, onProg){
  const g = S.grades[gi], s = S.set, ppm = s.dpi / 25.4;
  const W = Math.round((2*s.pageW + 2*s.bleed) * ppm), H = Math.round((s.pageH + 2*s.bleed) * ppm);
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = s.bg; ctx.fillRect(0, 0, W, H);
  ctx.setTransform(ppm, 0, 0, ppm, s.bleed*ppm, s.bleed*ppm);   // 以降は mm 単位（仕上がり左上が原点）
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  const { title } = pageBoxes();
  if (title && s.titles[gi]) {
    const fs = s.titlePt*PT2MM;
    ctx.font = `700 ${fs}px ${FONTS[s.titleFont]}`; ctx.fillStyle = s.titleColor; ctx.textBaseline = 'middle';
    ctx.textAlign = s.titleAlign;
    const tx = s.titleAlign === 'left' ? title.x : s.titleAlign === 'center' ? title.x + title.w/2 : title.x + title.w;
    ctx.fillText(s.titles[gi], tx, title.y + title.h/2);
  }
  const lay = layoutSpread(g.photos.map(p => p.w/p.h));
  let n = 0;
  for (const c of lay.cells) {
    const p = g.photos[c.i];
    const url = URL.createObjectURL(p.file);
    try {
      const img = await loadImg(url);
      const iw = img.naturalWidth, ih = img.naturalHeight;
      const b = cropBox({ ...p, w:iw, h:ih }, c.w, c.h);
      const sx = -b.left / b.k, sy = -b.top / b.k, sw = c.w / b.k, sh = c.h / b.k;
      ctx.save();
      if (s.radius) { roundRectPath(ctx, c.x, c.y, c.w, c.h, s.radius); ctx.clip(); }
      ctx.drawImage(img, sx, sy, sw, sh, c.x, c.y, c.w, c.h);
      if (s.stroke) {
        ctx.strokeStyle = s.strokeColor; ctx.lineWidth = s.stroke*2;   // 内側半分だけ見える（clip）
        if (!s.radius) { ctx.beginPath(); ctx.rect(c.x, c.y, c.w, c.h); ctx.clip(); ctx.beginPath(); ctx.rect(c.x, c.y, c.w, c.h); }
        else roundRectPath(ctx, c.x, c.y, c.w, c.h, s.radius);
        ctx.stroke();
      }
      ctx.restore();
      img.src = '';
    } finally { URL.revokeObjectURL(url); }
    onProg && onProg(++n / lay.cells.length);
  }
  return cv;
}
async function toJpeg(canvas, dpi){
  const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.95));
  const buf = new Uint8Array(await blob.arrayBuffer());
  // JFIF ヘッダの解像度を指定 dpi に書き換え（印刷所でサイズが正しく出るように）
  if (buf[6] === 0x4A && buf[7] === 0x46 && buf[8] === 0x49 && buf[9] === 0x46 && buf[10] === 0) {
    buf[13] = 1; buf[14] = dpi >> 8; buf[15] = dpi & 255; buf[16] = dpi >> 8; buf[17] = dpi & 255;
  }
  return new Blob([buf], { type:'image/jpeg' });
}
function crop(src, x, w){
  const c = document.createElement('canvas'); c.width = w; c.height = src.height;
  c.getContext('2d').drawImage(src, x, 0, w, src.height, 0, 0, w, src.height); return c;
}
function download(blob, name){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}
async function exportGrades(list, pages){
  const todo = list.filter(gi => S.grades[gi].photos.length);
  if (!todo.length) { alert('写真が入っている学年がありません。'); return; }
  const s = S.set, ppm = s.dpi / 25.4;
  try {
    for (let k = 0; k < todo.length; k++) {
      const gi = todo[k], name = `grade${gi+1}`;   // ファイル名は環境差が出ないよう英数字のみ
      const cv = await renderSpreadCanvas(gi, f => overlay(true, `${s.titles[gi]} を書き出し中…`, (k + f*0.9)/todo.length));
      if (pages) {
        const pw = Math.round((s.pageW + 2*s.bleed) * ppm);
        download(await toJpeg(crop(cv, 0, pw), s.dpi), `${name}_left.jpg`);
        download(await toJpeg(crop(cv, cv.width - pw, pw), s.dpi), `${name}_right.jpg`);
      } else {
        download(await toJpeg(cv, s.dpi), `${name}_spread.jpg`);
      }
      cv.width = cv.height = 0;
    }
  } catch (err) {
    alert('書き出しに失敗しました：' + err.message + '\n解像度(dpi)を下げると成功する場合があります。');
  } finally { overlay(false); }
}
$('#expSpread').onclick = () => exportGrades([S.cur], false);
$('#expPages').onclick = () => exportGrades([S.cur], true);
$('#expAll').onclick = () => {
  const both = confirm('全学年を書き出します。\n\nOK → 見開き1枚ずつ\nキャンセル → 次の確認へ（左右ページ別）');
  if (both) exportGrades([0,1,2,3,4,5], false);
  else if (confirm('左右ページ別で全学年を書き出しますか？')) exportGrades([0,1,2,3,4,5], true);
};

render();
</script>
</body>
